# Pushing a `vX.Y.Z` tag builds nox for Apple Silicon, signs it with the Developer ID, notarizes
# and staples it, and publishes the dmg + zip to GitHub Releases (also kept as a workflow
# artifact). Same secrets and flow as kayet / zora (SPEC §15.2). ci.yml stays unsigned.
# The version comes from the tag (SPEC §15.1): the build sets it in Cargo.toml / Cargo.lock,
# and for stable tags the bump, the new CHANGELOG.md section and the website's version are first
# committed to master.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  commit-version:
    # Stable tags only: commit the version bump, the new CHANGELOG.md section and the website's
    # version (download pill) to the default branch, if the tagged commit is on it, before
    # anything is built. A rejected push (e.g. branch protection) fails the release early.
    # Pre-release tags and tags off the default branch skip the commit and go on to the build. A
    # push with GITHUB_TOKEN doesn't start ci.yml.
    runs-on: ubuntu-24.04
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit version, changelog and website version
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin "$BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::notice::$GITHUB_REF_NAME is not on $BRANCH; not committing the version bump"
            exit 0
          fi
          scripts/release/set_version.sh "$GITHUB_REF_NAME"
          scripts/release/changelog.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
          scripts/release/set_website_version.sh "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock CHANGELOG.md website/index.html website/script.js
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Release ${GITHUB_REF_NAME#v}"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

  build:
    needs: commit-version
    runs-on: macos-15
    # Build + tests take ~15 min; cap it so a stuck Apple notary queue can't burn runner minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Set the workspace version from the tag
        run: scripts/release/set_version.sh "$GITHUB_REF_NAME"

      - run: cargo test --release --workspace

      - name: Import Developer ID certificate
        # Imports the base64-encoded .p12 into a one-shot keychain; removed in the last step.
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[" ]//g')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Bundle and sign (inside-out, hardened runtime)
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUILD_NUMBER: ${{ github.run_number }}
          # The updater stays off until the repository is public (SPEC §15.4).
          NOX_FEATURES: ""
        run: scripts/bundle.sh

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/notarize.sh dist/nox.app

      - name: Package and sign dmg
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/release/make_dmg.sh dist/nox.app dist/nox-macos-aarch64.dmg

      - name: Notarize and staple dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/notarize.sh dist/nox-macos-aarch64.dmg

      - name: Zip and checksums
        run: |
          ditto -c -k --keepParent dist/nox.app dist/nox-macos-aarch64.zip
          (cd dist && shasum -a 256 nox-macos-aarch64.dmg nox-macos-aarch64.zip > SHA256SUMS)

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/devid.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: nox-macos-aarch64
          path: |
            dist/nox-macos-aarch64.dmg
            dist/nox-macos-aarch64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: nox-macos-aarch64
          path: dist

      - name: Release notes (CHANGELOG.md Unreleased / version section, else commits since the previous tag)
        run: scripts/release/changelog.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"

      # Created as a draft and published once every asset is uploaded (SPEC §15.2 step 11).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" --draft $PRE --title "nox ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/nox-macos-aarch64.dmg dist/nox-macos-aarch64.zip dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false

  update-homebrew-cask:
    # Only once the repository is public (SPEC §15.4) and for stable releases. GITHUB_TOKEN can't
    # start a workflow in another repository, hence the personal token.
    needs: release
    if: github.event.repository.private == false && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    steps:
      - name: Start the tap's Update formulae workflow
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh workflow run update-formulae.yml -R pwittchen/homebrew-tap \
            -f formula=nox -f version="${GITHUB_REF_NAME#v}"
