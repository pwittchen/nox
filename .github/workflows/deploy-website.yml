# Builds the website (website/, Bun) and rsyncs website/dist/ to /var/www/noxterminal/ on the VPS
# (secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT). Runs on pushes to master that touch
# website/, by hand, and from release.yml once a stable release is published (SPEC §15.2).
name: deploy-website
on:
  push:
    branches: [master]
    paths: ['website/**']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    # A #no-deploy in the commit message of a branch push skips the deploy; calls from the release
    # workflow (tag pushes) always deploy.
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '#no-deploy')) }}
    runs-on: ubuntu-24.04
    steps:
      # master, not the tag: the release commits the website's version to master after tagging.
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: oven-sh/setup-bun@v2

      - name: Build website
        run: cd website && bun install && bun run build

      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: website/dist/
          remote_path: /var/www/noxterminal/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}
