# Everforest (medium) for nox.
# Source of truth for the colors: https://github.com/sainnhe/everforest/blob/master/palette.md
# Roles follow upstream (red keywords, aqua strings, purple numbers, grey comments).
# UI tokens are copied from kayet's bundled theme of the same name; the hl-* keys are
# kayet's syntax colors, accepted and ignored by nox.
# Terminal (ANSI) colors: everforest's terminal colors (sainnhe/everforest palette.md, medium).
# Bundled with nox: set `theme = "everforest"` in [ui] of ~/.nox/config.toml or pick it from
# `Switch Theme…`. A copy in ~/.nox/themes/everforest.toml takes precedence.
# See SPEC.md §9 for the format.

[dark]
bg = "#2d353b"
bg-sidebar = "#232a2e"
text = "#d3c6aa"
text-muted = "#859289"
border = "#3d484d"
accent = "#a7c080"
selection = "#a7c08033"
caret = "#d3c6aa"
hl-keyword = "#e67e80"
hl-string = "#83c092"
hl-number = "#d699b6"
hl-title = "#e69875"
hl-comment = "#859289"

[dark.ansi]
black = "#475258"
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"
white = "#d3c6aa"
bright-black = "#859289"
bright-red = "#e67e80"
bright-green = "#a7c080"
bright-yellow = "#dbbc7f"
bright-blue = "#7fbbb3"
bright-magenta = "#d699b6"
bright-cyan = "#83c092"
bright-white = "#d3c6aa"

[light]
bg = "#fdf6e3"
bg-sidebar = "#efebd4"
text = "#5c6a72"
text-muted = "#939f91"
border = "#e6e2cc"
accent = "#8da101"
selection = "#8da10133"
caret = "#5c6a72"
hl-keyword = "#f85552"
hl-string = "#35a77c"
hl-number = "#df69ba"
hl-title = "#f57d26"
hl-comment = "#939f91"

[light.ansi]
black = "#5c6a72"
red = "#f85552"
green = "#8da101"
yellow = "#dfa000"
blue = "#3a94c5"
magenta = "#df69ba"
cyan = "#35a77c"
white = "#dfddc8"
bright-black = "#939f91"
bright-red = "#f85552"
bright-green = "#8da101"
bright-yellow = "#dfa000"
bright-blue = "#3a94c5"
bright-magenta = "#df69ba"
