# Tokyo Night for nox: Night (dark) and Day (light).
# Source of truth for the colors: https://github.com/folke/tokyonight.nvim (extras/)
# Roles follow upstream (magenta keywords, green strings, orange numbers, blue titles),
# with dark5 comments (upstream's comment color is too faint for prose) and blue links.
# UI tokens are copied from kayet's bundled theme of the same name; the hl-* keys are
# kayet's syntax colors, accepted and ignored by nox.
# Terminal (ANSI) colors: tokyonight.nvim extras/ (night and day terminal colors).
# Bundled with nox: set `theme = "tokyo-night"` in [ui] of ~/.nox/config.toml or pick it from
# `Switch Theme…`. A copy in ~/.nox/themes/tokyo-night.toml takes precedence.
# See SPEC.md §9 for the format.

[dark]
bg = "#1a1b26"
bg-sidebar = "#16161e"
text = "#c0caf5"
text-muted = "#737aa2"
border = "#292e42"
accent = "#7aa2f7"
selection = "#283457"
caret = "#c0caf5"
hl-keyword = "#bb9af7"
hl-string = "#9ece6a"
hl-number = "#ff9e64"
hl-title = "#7aa2f7"
hl-comment = "#737aa2"

[dark.ansi]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
bright-black = "#414868"
bright-red = "#f7768e"
bright-green = "#9ece6a"
bright-yellow = "#e0af68"
bright-blue = "#7aa2f7"
bright-magenta = "#bb9af7"
bright-cyan = "#7dcfff"
bright-white = "#c0caf5"

[light]
bg = "#e1e2e7"
bg-sidebar = "#e9e9ed"
text = "#3760bf"
text-muted = "#68709a"
border = "#c4c8da"
accent = "#2e7de9"
selection = "#b7c1e3"
caret = "#3760bf"
hl-keyword = "#9854f1"
hl-string = "#587539"
hl-number = "#b15c00"
hl-title = "#2e7de9"
hl-comment = "#68709a"

[light.ansi]
black = "#e9e9ed"
red = "#f52a65"
green = "#587539"
yellow = "#8c6c3e"
blue = "#2e7de9"
magenta = "#9854f1"
cyan = "#007197"
white = "#6172b0"
bright-black = "#a1a6c5"
bright-red = "#f52a65"
bright-green = "#587539"
bright-yellow = "#8c6c3e"
bright-blue = "#2e7de9"
bright-magenta = "#9854f1"
bright-cyan = "#007197"
bright-white = "#3760bf"
