# Solarized for nox.
# Source of truth for the colors: https://ethanschoonover.com/solarized/
# Roles follow vim-colors-solarized (green keywords, cyan strings and numbers,
# orange titles, base01 / base1 comments).
# UI tokens are copied from kayet's bundled theme of the same name; the hl-* keys are
# kayet's syntax colors, accepted and ignored by nox.
# Terminal (ANSI) colors: Solarized's canonical 16-color terminal mapping (same for dark and light).
# Bundled with nox: set `theme = "solarized"` in [ui] of ~/.nox/config.toml or pick it from
# `Switch Theme…`. A copy in ~/.nox/themes/solarized.toml takes precedence.
# See SPEC.md §9 for the format.

[dark]
bg = "#002b36"
bg-sidebar = "#073642"
text = "#839496"
text-muted = "#586e75"
border = "#073642"
accent = "#268bd2"
selection = "#268bd233"
caret = "#93a1a1"
hl-keyword = "#859900"
hl-string = "#2aa198"
hl-number = "#d33682"
hl-title = "#cb4b16"
hl-comment = "#586e75"

[dark.ansi]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"
bright-black = "#002b36"
bright-red = "#cb4b16"
bright-green = "#586e75"
bright-yellow = "#657b83"
bright-blue = "#839496"
bright-magenta = "#6c71c4"
bright-cyan = "#93a1a1"
bright-white = "#fdf6e3"

[light]
bg = "#fdf6e3"
bg-sidebar = "#eee8d5"
text = "#657b83"
text-muted = "#93a1a1"
border = "#eee8d5"
accent = "#268bd2"
selection = "#268bd233"
caret = "#586e75"
hl-keyword = "#859900"
hl-string = "#2aa198"
hl-number = "#d33682"
hl-title = "#cb4b16"
hl-comment = "#93a1a1"

[light.ansi]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"
bright-black = "#002b36"
bright-red = "#cb4b16"
bright-green = "#586e75"
