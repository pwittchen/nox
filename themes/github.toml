# GitHub for nox: GitHub Dark Default (dark) and GitHub Light Default (light).
# Source of truth for the colors: https://github.com/primer/github-vscode-theme
# (v6.3.5, MIT, © GitHub). The repo ships no theme files; the values below come from
# themes/dark-default.json and themes/light-default.json as generated by its build
# (src/theme.js over @primer/primitives). GitHub Dark Dimmed and the high-contrast and
# colorblind variants are not included.
# Roles follow the VS Code themes: red keywords, dark-blue (light) / pale-blue (dark)
# strings, blue numbers and headings, grey comments, blue cursor and accent.
# The selection is "derived": theme.js sets editor.selectionBackground to accent.fg at
# 20%, but a later high-contrast-only line overwrites it, so the built theme falls back
# to VS Code's default; this uses the intended value.
# UI colors ported to kayet by Terre6 (https://github.com/pwittchen/kayet/issues/15).
# UI tokens are copied from kayet's bundled theme of the same name; the hl-* keys are
# kayet's syntax colors, accepted and ignored by nox.
# Terminal (ANSI) colors: github-vscode-theme terminal.ansi* colors (dark-default.json, light-default.json).
# Bundled with nox: set `theme = "github"` in [ui] of ~/.nox/config.toml or pick it from
# `Switch Theme…`. A copy in ~/.nox/themes/github.toml takes precedence.
# See SPEC.md §9 for the format.

[dark]  # GitHub Dark Default
bg = "#0d1117"           # editor.background
bg-sidebar = "#010409"   # sideBar.background
text = "#e6edf3"         # editor.foreground
text-muted = "#7d8590"   # descriptionForeground, tab.inactiveForeground
border = "#30363d"       # sideBar.border, panel.border
accent = "#2f81f7"       # textLink.foreground (accent.fg)
selection = "#2f81f733"  # derived: accent.fg at 20%, as intended by theme.js
caret = "#2f81f7"        # editorCursor.foreground
hl-keyword = "#ff7b72"   # keyword
hl-string = "#a5d6ff"    # string
hl-number = "#79c0ff"    # constant
hl-title = "#79c0ff"     # markup.heading
hl-comment = "#8b949e"   # comment

[dark.ansi]
black = "#484f58"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#b1bac4"
bright-black = "#6e7681"
bright-red = "#ffa198"
bright-green = "#56d364"
bright-yellow = "#e3b341"
bright-blue = "#79c0ff"
bright-magenta = "#d2a8ff"
bright-cyan = "#56d4dd"
bright-white = "#ffffff"

[light]  # GitHub Light Default
bg = "#ffffff"           # editor.background
bg-sidebar = "#f6f8fa"   # sideBar.background
text = "#1f2328"         # editor.foreground
text-muted = "#656d76"   # descriptionForeground, tab.inactiveForeground
border = "#d0d7de"       # sideBar.border, panel.border
accent = "#0969da"       # textLink.foreground (accent.fg)
selection = "#0969da33"  # derived: accent.fg at 20%, as intended by theme.js
caret = "#0969da"        # editorCursor.foreground
hl-keyword = "#cf222e"   # keyword
hl-string = "#0a3069"    # string
hl-number = "#0550ae"    # constant
hl-title = "#0550ae"     # markup.heading
hl-comment = "#6e7781"   # comment

[light.ansi]
black = "#24292f"
red = "#cf222e"
green = "#116329"
yellow = "#4d2d00"
blue = "#0969da"
magenta = "#8250df"
cyan = "#1b7c83"
white = "#6e7781"
bright-black = "#57606a"
bright-red = "#a40e26"
bright-green = "#1a7f37"
bright-yellow = "#633c01"
bright-blue = "#218bff"
bright-magenta = "#a475f9"
bright-cyan = "#3192aa"
bright-white = "#8c959f"
