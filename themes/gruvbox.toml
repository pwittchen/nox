# gruvbox for nox.
# Source of truth for the colors: https://github.com/morhetz/gruvbox/blob/master/colors/gruvbox.vim
# Roles follow upstream (blue links) and VS Code's gruvbox port (aqua selection).
# UI tokens are copied from kayet's bundled theme of the same name; the hl-* keys are
# kayet's syntax colors, accepted and ignored by nox.
# Terminal (ANSI) colors: gruvbox's terminal palette (morhetz/gruvbox, gruvbox-contrib).
# Bundled with nox: set `theme = "gruvbox"` in [ui] of ~/.nox/config.toml or pick it from
# `Switch Theme…`. A copy in ~/.nox/themes/gruvbox.toml takes precedence.
# Either section may be left out: a single-variant theme is always shown in that variant.
# See SPEC.md §9 for the format.

[dark]
bg = "#282828"
bg-sidebar = "#1d2021"
text = "#ebdbb2"
text-muted = "#928374"
border = "#3c3836"
accent = "#83a598"
selection = "#689d6a40"
caret = "#ebdbb2"
hl-keyword = "#fb4934"
hl-string = "#b8bb26"
hl-number = "#d3869b"
hl-title = "#fabd2f"
hl-comment = "#928374"

[dark.ansi]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright-black = "#928374"
bright-red = "#fb4934"
bright-green = "#b8bb26"
bright-yellow = "#fabd2f"
bright-blue = "#83a598"
bright-magenta = "#d3869b"
bright-cyan = "#8ec07c"
bright-white = "#ebdbb2"

